name: Update Shadowrocket configs

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）自动更新全部配置
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate all Shadowrocket configs
        env:
          BASE_RAW_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 convert.py

      - name: Commit generated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "dist/ 无变化，跳过提交"
          else
            git commit -m "chore: update Shadowrocket configs"
            git push
          fi
